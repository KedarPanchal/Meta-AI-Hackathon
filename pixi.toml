[workspace]
authors = ["KedarPanchal <kedar.t.panchal@outlook.com>"]
channels = ["conda-forge", "https://prefix.dev/robostack-lyrical"]
name = "meta-ai-hackathon"
platforms = [{ platform = "osx-arm64", macos = "27.0.1" }, "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
ros2-desktop-full = ">=0.13.0,<0.14"
ros2-ros-gz = ">=3.0.10,<4"
colcon-common-extensions = ">=0.3.0,<0.4"
pandas = ">=3.1.0,<4"
pyarrow = ">=25.0.0,<26"
scipy = ">=1.18.1,<2"
brian2 = ">=2.11.0,<3"
fastapi = ">=0.162.0,<0.163"
uvicorn = ">=0.54.0,<0.55"
httpx = ">=0.28.1,<0.29"
fastmcp = ">=4.1.4,<5"
cxx-compiler = ">=2.0.0,<3"

[activation.env]
GZ_SIM_RESOURCE_PATH = "$PIXI_PROJECT_ROOT/models:$PIXI_PROJECT_ROOT/worlds"
GZ_SIM_RENDER_ENGINE_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/gz-rendering-10/engine-plugins"
GZ_IP = "127.0.0.1"
OGRE_PLUGIN_DIR = "$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/OGRE"
