# Fly the X-UAV with the connectome brain.
#
#   ros2 launch fly_drone launch-fly.yaml
#   ros2 launch fly_drone launch-fly.yaml backend:=flycns flycns_repo:=/path/to/FLYCNS
#
# Output is DISABLED by default: the node computes commands and drops them, so you can watch
# what the brain wants to do against a live simulator before anything moves. Arm it with the
# enable_output MCP tool, or:
#
#   ros2 param set /fly_brain_pilot enable_output true
#
# Topics default to plain Gazebo through ros_gz_bridge (a body-frame geometry_msgs/Twist),
# which is the only vehicle interface this workspace has message packages for. For PX4 set
# bridge:=px4 and add px4_msgs to pixi.toml; for MAVROS set bridge:=mavros.
launch:

- arg: {name: backend,        default: "mock",     description: "mock or flycns"}
- arg: {name: flycns_repo,    default: "",         description: "Path to the FLYCNS clone"}
- arg: {name: flycns_data,    default: "testdata", description: "Graph dir: testdata (toy) or data (real)"}
- arg: {name: bridge,         default: "twist",    description: "twist, twist_stamped, px4 or mavros"}
- arg: {name: cmd_vel_topic,  default: "/xuav/cmd_vel"}
- arg: {name: odom_topic,     default: "/xuav/odom"}
- arg: {name: image_topic,    default: "/xuav/camera/image_raw"}
- arg: {name: loop_hz,        default: "20.0",     description: "Control loop rate"}
- arg: {name: brain_tick_ms,  default: "50",       description: "Simulated ms per tick. Below ~100 ms the fixed brian2 run() overhead dominates; see REFLEX.md"}
- arg: {name: enable_output,  default: "false",    description: "Arm the vehicle output at startup"}
- arg: {name: arousal,        default: "0.0",      description: "P1/pC1 pursuit gate, 0..1. 0 hovers"}
- arg: {name: detect_mode,    default: "color",    description: "color or motion"}
- arg: {name: detect_color,   default: "red"}
- arg: {name: max_speed,      default: "5.0"}
- arg: {name: min_altitude,   default: "1.0"}

- node:
    pkg: "fly_drone"
    exec: "brain_pilot"
    name: "fly_brain_pilot"
    output: "screen"
    param:
    - {name: "enable_output", value: "$(var enable_output)"}
    - {name: "arousal",       value: "$(var arousal)"}
    - {name: "audio_mode",    value: "synthetic"}
    env:
    # Never FLYCNS_*: FLYCNS treats any such variable as a declared perturbation of the model
    # and stamps it into every report it writes. Ours are FLYDRONE_*.
    - {name: "BRAIN_BACKEND",       value: "$(var backend)"}
    - {name: "FLYDRONE_REPO",       value: "$(var flycns_repo)"}
    - {name: "FLYDRONE_DATA",       value: "$(var flycns_data)"}
    - {name: "BRAIN_TICK_MS",       value: "$(var brain_tick_ms)"}
    - {name: "LOOP_HZ",             value: "$(var loop_hz)"}
    - {name: "ROS_BRIDGE",          value: "$(var bridge)"}
    - {name: "ROS_TOPIC_CMD_VEL",   value: "$(var cmd_vel_topic)"}
    - {name: "ROS_TOPIC_ODOM",      value: "$(var odom_topic)"}
    - {name: "ROS_TOPIC_IMAGE",     value: "$(var image_topic)"}
    - {name: "FLYDRONE_DETECT",     value: "$(var detect_mode)"}
    - {name: "FLYDRONE_DETECT_COLOR", value: "$(var detect_color)"}
    - {name: "MAX_SPEED",           value: "$(var max_speed)"}
    - {name: "MIN_ALTITUDE_M",      value: "$(var min_altitude)"}
