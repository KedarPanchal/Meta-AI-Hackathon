- ros_topic_name: /drone/cmd_vel
  gz_topic_name: /X3/gazebo/command/twist
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /drone/enable
  gz_topic_name: /X3/enable
  ros_type_name: std_msgs/msg/Bool
  gz_type_name: gz.msgs.Boolean
  direction: ROS_TO_GZ

- ros_topic_name: /drone/camera_image
  gz_topic_name: /X3/camera_front/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /drone/lidar_pointcloud
  gz_topic_name: /X3/lidar/scan/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
